name: Smyths Monitor

on:
  schedule:
    # Entferne das '#' am Anfang der nächsten Zeile, damit es alle 5 Minuten läuft:
     - cron: '*/5 * * * *'
  workflow_dispatch: # Erlaubt es dir, das Skript manuell zu starten

jobs:
  check-stock:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run monitor
        env:
          # Hier wird jetzt das sichere Bot-Token an dein Skript übergeben:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
        run: python monitor.py
