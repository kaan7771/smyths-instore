name: Smyths Monitor

on:
  schedule:
    # Scannt das gesamte Jahr über bedingungslos alle 5 Minuten (24/7):
    - cron: '*/5 * * * *'
  workflow_dispatch: # Erlaubt es dir, das Skript zusätzlich manuell zu starten

jobs:
  check-stock:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run monitor
        env:
          # Übergibt das sichere Bot-Token an das Skript
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
        run: python monitor.py
