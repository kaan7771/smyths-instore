name: Smyths Monitor

on:
  schedule:
    # Startet das Skript vollautomatisch alle 5 Minuten rund um die Uhr
    - cron: '*/5 * * * *'
  workflow_dispatch: # Erlaubt es dir weiterhin, das Skript auch manuell zu starten

jobs:
  check-stock:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Run monitor
      env:
        DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
      run: python monitor.py
