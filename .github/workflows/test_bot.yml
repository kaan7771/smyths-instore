name: Test Discord Bot

on:
  workflow_dispatch: # Aktiviert den Start-Button

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
    - name: Code auschecken
      uses: actions/checkout@v4

    - name: Python einrichten
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Discord Bibliothek installieren
      run: pip install discord.py

    - name: Bot Test ausfuehren
      env:
        BOT_TOKEN: ${{ secrets.DISCORD_TOKEN }} # Nutzt dein bestehendes Secret
      run: python post_rules.py
